services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digilocker-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_ENV=production
      - NEXT_PUBLIC_APP_NAME=DigiLocker Vault
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_STORAGE_BUCKET=digilocker-vault-production
      - NEXT_PUBLIC_STORAGE_REGION=us-east-1
      - DATABASE_URL=file:/app/prisma/prod.db
      - AUTH_SECRET=production-super-secret-key-at-least-32-chars!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
